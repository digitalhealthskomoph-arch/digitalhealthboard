name: Keep Supabase Alive

on:
  schedule:
    # Runs daily at 04:00 UTC (11:00 AM Thailand time GMT+7)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping-supabase:
    name: Keep-Alive Multi-Target Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Multi-Target Keep-Alive Script (Direct + Vercel Fallback)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://qmizczkkoizqskburrgd.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_pBu35ni4KVfjH6fQ99vutg_-yL2WyF8' }}
          APP_URL: 'https://digitalhealthboard.vercel.app/api/keep-alive'
        run: |
          node scripts/keep-alive.mjs

      - name: Secondary Curl Ping Check (with retries and DNS resilience)
        run: |
          echo "=========================================================="
          echo "Running secondary curl verification..."
          echo "=========================================================="

          # Ping Vercel Web App Endpoint
          echo "Pinging Vercel Keep-Alive Route..."
          curl -sS -i --retry 3 --retry-delay 2 --retry-all-errors --max-time 15 \
            "https://digitalhealthboard.vercel.app/api/keep-alive" || true

          echo ""
          echo "✅ Keep-Alive workflow run completed successfully!"
